name: Build AngelLive

on:
  workflow_dispatch:                # 手动触发
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string
        default: '2.0.0'
      build_type:
        description: "构建类型"
        required: true
        default: "Release"
  

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    # 在整个 Job 中设置环境变量
    env:
      USE_VLC: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   repository: pcccccc/AngelLive
        #   fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.1.app"

      - name: install fastlane
        run: brew install fastlane
      
      - name: Build macOS target
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "AngelLive.xcworkspace" \
            -scheme "AngelLiveMacOS"
            
          xcodebuild clean build \
            -workspace "AngelLive.xcworkspace" \
            -scheme "AngelLiveMacOS" \
            -configuration ${{ github.event.inputs.build_type }} \
            -sdk macosx \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            # CODE_SIGN_STYLE="Manual" \
            # DEVELOPMENT_TEAM="" \
            # CODE_SIGN_ENTITLEMENTS="" \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_INSTALL=NO \
            -archivePath build/macos/AngelLive.xcarchive \
            archive

      - name: Export .app and zip
        run: |
          mkdir -p output/macos
          cp -R build/macos/AngelLive.xcarchive/Products/Applications/*.app output/macos/
          # cd output/macos && zip -r AngelLive_macOS.zip *.app
          cd output/macos && mv *.app  AngelLive-macOS-${{ github.event.inputs.tag }}.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelLive-macOS-${{ github.event.inputs.tag }}
          path: output/macos/*.app
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "AngelLive-${{ github.event.inputs.tag }}"
          name: "AngelLive-${{ github.event.inputs.tag }}"
          files: "output/macos/*.app"
          # draft: false
          # prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-ios:
    name: Build iOS App (No Signing)
    runs-on: macos-latest
    env:
      USE_VLC: 1
    steps:
      - uses: actions/checkout@v4
        # with:
        #   repository: pcccccc/AngelLive
        #   fetch-depth: 0
      # 在整个 Job 中设置环境变量
        
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.1.app"
        
      - name: Build iOS target
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "AngelLive.xcworkspace" \
            -scheme "AngelLive"
            
          xcodebuild clean build \
            -workspace "AngelLive.xcworkspace" \
            -scheme "AngelLive" \
            -configuration ${{ github.event.inputs.build_type }} \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            # CODE_SIGN_STYLE="Manual" \
            # DEVELOPMENT_TEAM="" \
            # CODE_SIGN_ENTITLEMENTS="" \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_INSTALL=NO \
            -archivePath build/ios/AngelLive.xcarchive \
            archive
      - name: Export app and zip
        run: |
          mkdir -p output/ios
          cp -R build/ios/AngelLive.xcarchive/Products/Applications/*.app output/ios/
          cd output/ios && zip -r AngelLive-iOS-${{ github.event.inputs.tag }}.ipa *.app

      - uses: actions/upload-artifact@v4
        with:
          name: AngelLive-iOS-${{ github.event.inputs.tag }}
          path: output/ios/*.ipa
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "AngelLive-${{ github.event.inputs.tag }}"
          name: "AngelLive-${{ github.event.inputs.tag }}"
          files: "output/macos/*.ipa"
          # draft: false
          # prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-tvos:
    name: Build tvOS App (No Signing)
    runs-on: macos-latest
    env:
      USE_VLC: 1
    steps:
      - uses: actions/checkout@v4
        # with:
        #   repository: pcccccc/AngelLive
        #   fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.1.app"

      - name: install fastlane
        run: brew install fastlane
        
      - name: Build tvOS target
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "AngelLive.xcworkspace" \
            -scheme "AngelLiveTVOS"
            
          xcodebuild clean build \
            -workspace "AngelLive.xcworkspace" \
            -scheme "AngelLiveTVOS" \
            -configuration ${{ github.event.inputs.build_type }} \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            # CODE_SIGN_STYLE="Manual" \
            # DEVELOPMENT_TEAM="" \
            # CODE_SIGN_ENTITLEMENTS="" \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_INSTALL=NO \
            -archivePath build/ios/AngelLive.xcarchive \
            archive
      - name: Export app and zip
        run: |
          mkdir -p output/tvos
          cp -R build/tvos/AngelLive_TV.xcarchive/Products/Applications/*.app output/tvos/
          cd output/tvos && zip -r AngelLive-tvOS-${{ github.event.inputs.tag }}.ipa *.app

      - uses: actions/upload-artifact@v4
        with:
          name: AngelLive-tvOS-${{ github.event.inputs.tag }}
          path: output/tvos/*.ipa
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "AngelLive-${{ github.event.inputs.tag }}"
          name: "AngelLive-${{ github.event.inputs.tag }}"
          files: "output/macos/*.ipa"
          # draft: false
          # prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
